stages:
  - lint
  - build

frontend-lint:
  stage: lint
  image: node:20
  cache:
    key: frontend-${CI_COMMIT_REF_SLUG}
    paths:
      - frontend/node_modules/
  before_script:
    - cd frontend
    - npm install
  script:
    - npm run lint

backend-lint:
  stage: lint
  image: maven:3.9.9-eclipse-temurin-17
  cache:
    key: backend-${CI_COMMIT_REF_SLUG}
    paths:
      - .m2/repository/
  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  script:
    - mvn -f backend/pom.xml checkstyle:check

frontend-build:
  stage: build
  image: node:20
  cache:
    key: frontend-${CI_COMMIT_REF_SLUG}
    paths:
      - frontend/node_modules/
  before_script:
    - cd frontend
    - npm install
  script:
    - npm run build

backend-build:
  stage: build
  image: maven:3.9.9-eclipse-temurin-17
  cache:
    key: backend-${CI_COMMIT_REF_SLUG}
    paths:
      - .m2/repository/
  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  script:
    - mvn -f backend/pom.xml clean test
