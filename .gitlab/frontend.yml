# Frontend CI/CD: lint → build → auto-deploy on main
stages:
  - lint
  - build
  - deploy

frontend-lint:
  stage: lint
  image: node:20
  cache:
    key: frontend-${CI_COMMIT_REF_SLUG}
    paths:
      - frontend/node_modules/
  script:
    - cd frontend
    - npm install
    - npm run lint

frontend-build:
  stage: build
  image: node:20
  cache:
    key: frontend-${CI_COMMIT_REF_SLUG}
    paths:
      - frontend/node_modules/
  script:
    - cd frontend
    - npm install
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 day

frontend-deploy:
  stage: deploy
  tags:
    - campusbridge-runner
  needs:
    - frontend-build
  script:
    - rm -rf /opt/campusbridge/static/*
    - cp -r frontend/dist/* /opt/campusbridge/static/
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
