stages:
  - lint
  - test
  - build
  - deploy

backend-lint:
  stage: lint
  image: maven:3.9.9-eclipse-temurin-17
  cache:
    key: backend-${CI_COMMIT_REF_SLUG}
    paths:
      - .m2/repository/
  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  script:
    - cd backend
    - mvn checkstyle:check

backend-test:
  stage: test
  image: maven:3.9.9-eclipse-temurin-17
  cache:
    key: backend-${CI_COMMIT_REF_SLUG}
    paths:
      - .m2/repository/
  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  script:
    - cd backend
    - cp src/main/resources/application-example.yml src/main/resources/application.yml
    - mvn test
  artifacts:
    when: always
    paths:
      - backend/target/surefire-reports/
    expire_in: 7 days

backend-build:
  stage: build
  image: maven:3.9.9-eclipse-temurin-17
  cache:
    key: backend-${CI_COMMIT_REF_SLUG}
    paths:
      - .m2/repository/
  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  script:
    - cd backend
    - cp src/main/resources/application-example.yml src/main/resources/application.yml
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - backend/target/backend-*.jar
    expire_in: 1 day

backend-deploy:
  stage: deploy
  tags:
    - campusbridge-runner
  needs:
    - backend-build
  script:
    - sudo systemctl stop campusbridge
    - cp backend/target/backend-*.jar /opt/campusbridge/backend.jar
    - sudo systemctl start campusbridge
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
