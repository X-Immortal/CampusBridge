<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1220" viewBox="0 0 1680 1220">
  <rect width="1680" height="1220" fill="#ffffff"/>
  <defs>
    <style>
      .title{font:700 26px Arial,"Microsoft YaHei",sans-serif;fill:#18212b}
      .subtitle{font:13px Arial,"Microsoft YaHei",sans-serif;fill:#4b5563}
      .module-title{font:700 17px Arial,"Microsoft YaHei",sans-serif;fill:#18212b}
      .table-title{font:700 15px Arial,"Microsoft YaHei",sans-serif;fill:#111827}
      .field{font:12px Arial,"Microsoft YaHei",sans-serif;fill:#1f2937}
      .note{font:12px Arial,"Microsoft YaHei",sans-serif;fill:#374151}
      .box{fill:#ffffff;stroke:#2f3640;stroke-width:1.2}
      .line{fill:none;stroke:#4b5563;stroke-width:1.4;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#6b7280;stroke-width:1.3;stroke-dasharray:6 5;marker-end:url(#arrow)}
      .mod-user{fill:#eaf4ff;stroke:#6ba4dd}
      .mod-post{fill:#f4ecff;stroke:#9b77d3}
      .mod-task{fill:#eaf8ed;stroke:#66aa72}
      .mod-msg{fill:#fff6dd;stroke:#d3aa44}
      .mod-gov{fill:#ffeceb;stroke:#d87970}
      .mod-file{fill:#f5f5f5;stroke:#8b8b8b}
      .head-user{fill:#d9ebff;stroke:#6ba4dd}
      .head-post{fill:#eadcff;stroke:#9b77d3}
      .head-task{fill:#ddf2e1;stroke:#66aa72}
      .head-msg{fill:#ffefc2;stroke:#d3aa44}
      .head-gov{fill:#ffd8d5;stroke:#d87970}
      .head-file{fill:#e7e7e7;stroke:#8b8b8b}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4b5563"/>
    </marker>
  </defs>

  <text x="42" y="48" class="title">校园互助服务平台 ER 图总览</text>
  <text x="42" y="76" class="subtitle">实线表示主要实体关系；虚线表示多态关联。跨模块外键在表字段中以 FK 标注，并在底部关系摘要中说明。</text>

  <!-- 用户与身份 -->
  <rect x="40" y="105" width="760" height="310" rx="10" class="mod-user" opacity="0.55"/>
  <text x="62" y="135" class="module-title">用户与身份模块</text>
  <rect x="80" y="165" width="220" height="130" rx="4" class="box"/>
  <rect x="80" y="165" width="220" height="32" class="head-user"/>
  <text x="98" y="186" class="table-title">users</text>
  <text x="94" y="218" class="field">PK id</text>
  <text x="94" y="238" class="field">username, password_hash</text>
  <text x="94" y="258" class="field">phone_cipher, phone_hash</text>
  <text x="94" y="278" class="field">role, enabled</text>

  <rect x="365" y="140" width="210" height="115" rx="4" class="box"/>
  <rect x="365" y="140" width="210" height="32" class="head-user"/>
  <text x="383" y="161" class="table-title">user_profiles</text>
  <text x="379" y="193" class="field">PK id, FK user_id</text>
  <text x="379" y="213" class="field">nickname, bio, campus</text>
  <text x="379" y="233" class="field">college, avatar_url, tags</text>

  <rect x="365" y="275" width="210" height="105" rx="4" class="box"/>
  <rect x="365" y="275" width="210" height="32" class="head-user"/>
  <text x="383" y="296" class="table-title">user_credits</text>
  <text x="379" y="328" class="field">PK id, FK user_id</text>
  <text x="379" y="348" class="field">points, level</text>

  <rect x="610" y="140" width="160" height="115" rx="4" class="box"/>
  <rect x="610" y="140" width="160" height="32" class="head-user"/>
  <text x="628" y="161" class="table-title">credit_records</text>
  <text x="624" y="193" class="field">PK id, FK user_id</text>
  <text x="624" y="213" class="field">change_value, reason</text>
  <text x="624" y="233" class="field">source_type, source_id</text>

  <rect x="610" y="275" width="160" height="105" rx="4" class="box"/>
  <rect x="610" y="275" width="160" height="32" class="head-user"/>
  <text x="628" y="296" class="table-title">campus_verifications</text>
  <text x="624" y="328" class="field">PK id, FK user_id</text>
  <text x="624" y="348" class="field">method, status</text>
  <text x="624" y="368" class="field">school, department</text>

  <line x1="300" y1="210" x2="365" y2="197" class="line"/><text x="314" y="194" class="note">1:1</text>
  <line x1="300" y1="244" x2="365" y2="325" class="line"/><text x="314" y="296" class="note">1:1</text>
  <line x1="575" y1="328" x2="610" y2="210" class="line"/><text x="578" y="270" class="note">1:N</text>
  <line x1="300" y1="258" x2="610" y2="326" class="line"/><text x="452" y="278" class="note">1:N</text>

  <!-- 帖子 -->
  <rect x="850" y="105" width="760" height="310" rx="10" class="mod-post" opacity="0.55"/>
  <text x="872" y="135" class="module-title">帖子模块</text>
  <rect x="900" y="165" width="230" height="135" rx="4" class="box"/>
  <rect x="900" y="165" width="230" height="32" class="head-post"/>
  <text x="918" y="186" class="table-title">posts</text>
  <text x="914" y="218" class="field">PK id, FK author_id</text>
  <text x="914" y="238" class="field">category, title, content</text>
  <text x="914" y="258" class="field">status, accepted_reply_id</text>
  <text x="914" y="278" class="field">reply_count, like_count, mark_count</text>

  <rect x="1190" y="165" width="230" height="135" rx="4" class="box"/>
  <rect x="1190" y="165" width="230" height="32" class="head-post"/>
  <text x="1208" y="186" class="table-title">replies</text>
  <text x="1204" y="218" class="field">PK id, FK post_id</text>
  <text x="1204" y="238" class="field">FK author_id</text>
  <text x="1204" y="258" class="field">parent_reply_id</text>
  <text x="1204" y="278" class="field">content, status, like_count</text>

  <rect x="1190" y="325" width="230" height="70" rx="4" class="box"/>
  <rect x="1190" y="325" width="230" height="32" class="head-post"/>
  <text x="1208" y="346" class="table-title">post_interactions</text>
  <text x="1204" y="376" class="field">FK user_id, target_type/id, type</text>

  <line x1="1130" y1="232" x2="1190" y2="232" class="line"/><text x="1148" y="220" class="note">1:N</text>
  <path d="M1305 300 C1305 318 1260 318 1260 300" class="line"/><text x="1266" y="322" class="note">父回复</text>
  <line x1="1015" y1="300" x2="1190" y2="360" class="dash"/><text x="1068" y="338" class="note">target</text>

  <!-- 任务 -->
  <rect x="40" y="455" width="1030" height="405" rx="10" class="mod-task" opacity="0.58"/>
  <text x="62" y="485" class="module-title">任务/订单模块</text>
  <rect x="80" y="515" width="250" height="210" rx="4" class="box"/>
  <rect x="80" y="515" width="250" height="32" class="head-task"/>
  <text x="98" y="536" class="table-title">tasks</text>
  <text x="94" y="568" class="field">PK id, FK requester_id</text>
  <text x="94" y="588" class="field">FK provider_id</text>
  <text x="94" y="608" class="field">category, title, description</text>
  <text x="94" y="628" class="field">campus, location, deadline</text>
  <text x="94" y="648" class="field">reward_type, reward_description</text>
  <text x="94" y="668" class="field">completion_standard</text>
  <text x="94" y="688" class="field">proof/contact/risk flags</text>
  <text x="94" y="708" class="field">status, created_at</text>

  <rect x="400" y="515" width="240" height="105" rx="4" class="box"/>
  <rect x="400" y="515" width="240" height="32" class="head-task"/>
  <text x="418" y="536" class="table-title">task_applications</text>
  <text x="414" y="568" class="field">PK id, FK task_id, applicant_id</text>
  <text x="414" y="588" class="field">message, status</text>
  <text x="414" y="608" class="field">created_at, handled_at</text>

  <rect x="730" y="515" width="240" height="105" rx="4" class="box"/>
  <rect x="730" y="515" width="240" height="32" class="head-task"/>
  <text x="748" y="536" class="table-title">completion_proofs</text>
  <text x="744" y="568" class="field">PK id, FK task_id, submitter_id</text>
  <text x="744" y="588" class="field">description</text>
  <text x="744" y="608" class="field">submitted_at</text>

  <rect x="400" y="690" width="240" height="115" rx="4" class="box"/>
  <rect x="400" y="690" width="240" height="32" class="head-task"/>
  <text x="418" y="711" class="table-title">task_histories</text>
  <text x="414" y="743" class="field">PK id, FK task_id</text>
  <text x="414" y="763" class="field">from_status, to_status</text>
  <text x="414" y="783" class="field">operator_id, note, created_at</text>

  <rect x="730" y="690" width="240" height="115" rx="4" class="box"/>
  <rect x="730" y="690" width="240" height="32" class="head-task"/>
  <text x="748" y="711" class="table-title">reviews</text>
  <text x="744" y="743" class="field">PK id, FK task_id</text>
  <text x="744" y="763" class="field">reviewer_id, reviewee_id</text>
  <text x="744" y="783" class="field">rating, comment</text>

  <line x1="330" y1="570" x2="400" y2="570" class="line"/><text x="350" y="558" class="note">1:N</text>
  <line x1="330" y1="610" x2="730" y2="570" class="line"/><text x="520" y="576" class="note">1:0..1</text>
  <line x1="330" y1="670" x2="400" y2="748" class="line"/><text x="350" y="718" class="note">1:N</text>
  <line x1="330" y1="700" x2="730" y2="748" class="line"/><text x="520" y="730" class="note">1:N</text>

  <!-- 会话 -->
  <rect x="1110" y="455" width="500" height="210" rx="10" class="mod-msg" opacity="0.58"/>
  <text x="1132" y="485" class="module-title">对话通知模块</text>
  <rect x="1150" y="515" width="190" height="115" rx="4" class="box"/>
  <rect x="1150" y="515" width="190" height="32" class="head-msg"/>
  <text x="1168" y="536" class="table-title">conversations</text>
  <text x="1164" y="568" class="field">PK id, type, title</text>
  <text x="1164" y="588" class="field">owner_id, peer_user_id</text>
  <text x="1164" y="608" class="field">related_type/id, replyable</text>

  <rect x="1390" y="515" width="180" height="115" rx="4" class="box"/>
  <rect x="1390" y="515" width="180" height="32" class="head-msg"/>
  <text x="1408" y="536" class="table-title">messages</text>
  <text x="1404" y="568" class="field">PK id, FK conversation_id</text>
  <text x="1404" y="588" class="field">sender_id nullable</text>
  <text x="1404" y="608" class="field">type, content, read_at</text>
  <line x1="1340" y1="572" x2="1390" y2="572" class="line"/><text x="1352" y="560" class="note">1:N</text>

  <!-- 附件与治理 -->
  <rect x="1110" y="705" width="500" height="155" rx="10" class="mod-file" opacity="0.62"/>
  <text x="1132" y="735" class="module-title">附件模块</text>
  <rect x="1150" y="765" width="420" height="70" rx="4" class="box"/>
  <rect x="1150" y="765" width="420" height="32" class="head-file"/>
  <text x="1168" y="786" class="table-title">attachments</text>
  <text x="1164" y="816" class="field">PK id, FK uploader_id, owner_type, owner_id, type, file_name, file_url, size, status</text>

  <rect x="40" y="900" width="1030" height="190" rx="10" class="mod-gov" opacity="0.52"/>
  <text x="62" y="930" class="module-title">治理模块</text>
  <rect x="80" y="965" width="300" height="90" rx="4" class="box"/>
  <rect x="80" y="965" width="300" height="32" class="head-gov"/>
  <text x="98" y="986" class="table-title">reports</text>
  <text x="94" y="1018" class="field">PK id, FK reporter_id, target_type, target_id</text>
  <text x="94" y="1038" class="field">reason, description, status</text>

  <rect x="510" y="965" width="300" height="90" rx="4" class="box"/>
  <rect x="510" y="965" width="300" height="32" class="head-gov"/>
  <text x="528" y="986" class="table-title">moderation_records</text>
  <text x="524" y="1018" class="field">PK id, FK report_id, handler_id</text>
  <text x="524" y="1038" class="field">target_type, target_id, status, decision</text>
  <line x1="380" y1="1010" x2="510" y2="1010" class="line"/><text x="424" y="998" class="note">1:N</text>

  <!-- 多态关联说明，避免长线交叉 -->
  <rect x="1110" y="900" width="500" height="190" rx="10" fill="#fafafa" stroke="#d1d5db"/>
  <text x="1132" y="930" class="module-title">多态与多对多关联说明</text>
  <line x1="1320" y1="765" x2="1320" y2="945" class="dash"/>
  <text x="1140" y="970" class="note">attachments.owner_type / owner_id 可指向：</text>
  <text x="1140" y="995" class="note">posts、replies、tasks、completion_proofs、messages、reports。</text>
  <text x="1140" y="1020" class="note">reports.target_type / target_id 可指向 posts、replies、tasks、users、messages。</text>
  <text x="1140" y="1048" class="note">users 与 posts/replies 为 N:M，经 post_interactions 表实现。</text>
  <text x="1140" y="1073" class="note">users 与 tasks 为 N:M，经 task_applications 表实现。</text>

  <!-- 关系摘要 -->
  <rect x="40" y="1120" width="1570" height="70" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="62" y="1148" class="module-title">关系摘要</text>
  <text x="62" y="1174" class="note">users 1:1 user_profiles / user_credits；users 1:N campus_verifications、posts、tasks、conversations、messages、reports。</text>
  <text x="780" y="1174" class="note">posts 1:N replies；tasks 1:N applications / histories / reviews；tasks 1:0..1 proofs；conversations 1:N messages。</text>
  <text x="62" y="1198" class="note">N:M：users 与 posts/replies 通过 post_interactions 关联；users 与 tasks 通过 task_applications 关联。</text>
</svg>

