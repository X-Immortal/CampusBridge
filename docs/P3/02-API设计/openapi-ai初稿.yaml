openapi: 3.0.3
info:
  title: 校园互助服务平台 API
  version: 0.1.0
  description: AI 根据需求文档生成的 API 初稿，用于 P3 任务 2.2 的接口审查实验。
servers:
  - url: /api/v1

tags:
  - name: Auth
  - name: User
  - name: Content
  - name: Post
  - name: Task
  - name: Review

security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: 用户注册
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAuthResult'
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/login:
    post:
      tags: [Auth]
      summary: 用户登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAuthResult'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me:
    get:
      tags: [User]
      summary: 查看当前用户信息
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUser'

  /users/me/profile:
    put:
      tags: [User]
      summary: 修改个人资料
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserProfileRequest'
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserProfile'

  /content:
    get:
      tags: [Content]
      summary: 浏览需求列表
      parameters:
        - name: keyword
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePagedContentItem'

  /posts:
    post:
      tags: [Post]
      summary: 发布帖子
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '200':
          description: 发布成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePost'

  /posts/{postId}:
    get:
      tags: [Post]
      summary: 查看帖子详情
      parameters:
        - name: postId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePost'

  /posts/{postId}/replies:
    post:
      tags: [Post]
      summary: 回复帖子
      parameters:
        - name: postId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReplyRequest'
      responses:
        '200':
          description: 回复成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseReply'

  /tasks:
    post:
      tags: [Task]
      summary: 发布任务
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '200':
          description: 发布成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTask'
    get:
      tags: [Task]
      summary: 查询任务列表
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTaskList'

  /tasks/{taskId}:
    get:
      tags: [Task]
      summary: 查看订单详情
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTask'

  /tasks/{taskId}/accept:
    post:
      tags: [Task]
      summary: 接单
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 接单成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTask'

  /tasks/{taskId}/complete:
    post:
      tags: [Task]
      summary: 完成任务
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 完成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTask'

  /tasks/{taskId}/reviews:
    post:
      tags: [Review]
      summary: 提交评价
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
      responses:
        '200':
          description: 评价成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseReview'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: 请求参数错误
    Unauthorized:
      description: 未认证或登录失效

  schemas:
    ApiResponseBase:
      type: object
      properties:
        code: { type: string, example: SUCCESS }
        message: { type: string, example: OK }

    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
        phone: { type: string }

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }

    AuthResult:
      type: object
      properties:
        userId: { type: integer, format: int64 }
        username: { type: string }
        token: { type: string }

    User:
      type: object
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        role: { type: string }

    UserProfile:
      type: object
      properties:
        userId: { type: integer, format: int64 }
        nickname: { type: string }
        bio: { type: string }
        campus: { type: string }

    UpdateUserProfileRequest:
      type: object
      properties:
        nickname: { type: string }
        bio: { type: string }
        campus: { type: string }

    ContentItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        type: { type: string }
        title: { type: string }
        summary: { type: string }
        createdAt: { type: string, format: date-time }

    Post:
      type: object
      properties:
        id: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        title: { type: string }
        content: { type: string }
        category: { type: string }
        createdAt: { type: string, format: date-time }

    CreatePostRequest:
      type: object
      required: [title, content]
      properties:
        title: { type: string }
        content: { type: string }
        category: { type: string }
        imageUrls:
          type: array
          items: { type: string }

    Reply:
      type: object
      properties:
        id: { type: integer, format: int64 }
        postId: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        content: { type: string }

    CreateReplyRequest:
      type: object
      required: [content]
      properties:
        content: { type: string }

    Task:
      type: object
      properties:
        id: { type: integer, format: int64 }
        requesterId: { type: integer, format: int64 }
        providerId: { type: integer, format: int64 }
        title: { type: string }
        description: { type: string }
        reward: { type: string }
        status: { type: string }

    CreateTaskRequest:
      type: object
      required: [title, description]
      properties:
        title: { type: string }
        description: { type: string }
        reward: { type: string }
        deadline: { type: string }

    CreateReviewRequest:
      type: object
      required: [rating]
      properties:
        rating: { type: integer }
        comment: { type: string }

    Review:
      type: object
      properties:
        id: { type: integer, format: int64 }
        taskId: { type: integer, format: int64 }
        reviewerId: { type: integer, format: int64 }
        rating: { type: integer }
        comment: { type: string }

    ApiResponseAuthResult:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/AuthResult' }
    ApiResponseUser:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/User' }
    ApiResponseUserProfile:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/UserProfile' }
    ApiResponsePagedContentItem:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              type: object
              properties:
                items:
                  type: array
                  items: { $ref: '#/components/schemas/ContentItem' }
                total: { type: integer, format: int64 }
    ApiResponsePost:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Post' }
    ApiResponseReply:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Reply' }
    ApiResponseTask:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Task' }
    ApiResponseTaskList:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Task' }
    ApiResponseReview:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Review' }


