components:
  schemas:
    ConfirmEmailVerificationRequest:
      type: object
      properties:
        code:
          type: string
    CreateConversationRequest:
      type: object
      properties:
        initialMessage:
          type: string
        peerUserId:
          type: integer
          format: int64
        relatedId:
          type: integer
          format: int64
        relatedType:
          type: string
    CreatePostInteractionRequest:
      type: object
      properties:
        type:
          type: string
          enum:
          - LIKE
          - MARK
    CreatePostRequest:
      type: object
      properties:
        attachmentIds:
          type: array
          items:
            type: integer
            format: int64
        category:
          type: string
          enum:
          - INQUIRY_HELP
          - SECOND_HAND
          - TEAM_FRIEND
          - CAMPUS_SOCIAL
        content:
          type: string
        title:
          type: string
    CreateReplyRequest:
      type: object
      properties:
        content:
          type: string
        parentReplyId:
          type: integer
          format: int64
    CreateReportRequest:
      type: object
      properties:
        description:
          type: string
        reason:
          type: string
        targetId:
          type: integer
          format: int64
        targetType:
          type: string
          enum:
          - POST
          - REPLY
          - TASK
          - USER
          - MESSAGE
    CreateReviewRequest:
      type: object
      properties:
        comment:
          type: string
        rating:
          type: integer
          format: int32
        revieweeId:
          type: integer
          format: int64
    CreateTaskApplicationRequest:
      type: object
      properties:
        message:
          type: string
    CreateTaskRequest:
      type: object
      properties:
        allowOfflineContact:
          type: boolean
        attachmentIds:
          type: array
          items:
            type: integer
            format: int64
        campus:
          type: string
        category:
          type: string
          enum:
          - ERRAND
          - AGENCY
        completionStandard:
          type: string
        deadline:
          type: string
          format: date-time
        deliveryLocation:
          type: string
        description:
          type: string
        isInstantTask:
          type: boolean
        location:
          type: string
        onlyInAppContact:
          type: boolean
        requiresProof:
          type: boolean
        rewardAmount:
          type: integer
          format: int32
        rewardDescription:
          type: string
        rewardType:
          type: string
          enum:
          - FREE
          - POINTS
          - CASH
          - NEGOTIABLE
        riskDisclosureConfirmed:
          type: boolean
        routeHint:
          type: string
        sensitiveReason:
          type: string
        title:
          type: string
    CreateVerificationRequest:
      type: object
      properties:
        campusEmail:
          type: string
        department:
          type: string
        evidenceUrl:
          type: string
        method:
          type: string
          enum:
          - STUDENT_CARD_IMAGE
          - CAMPUS_EMAIL
          - MANUAL_REVIEW
        realName:
          type: string
        school:
          type: string
        studentNumber:
          type: string
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        details:
          type: array
          items:
            type: string
        message:
          type: string
        meta:
          $ref: "#/components/schemas/Meta"
    LoginRequest:
      type: object
      properties:
        password:
          type: string
        username:
          type: string
    Meta:
      type: object
      properties:
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    RegisterRequest:
      type: object
      properties:
        code:
          type: string
        email:
          type: string
        password:
          type: string
        phone:
          type: string
        username:
          type: string
    ResolveReportRequest:
      type: object
      properties:
        creditChange:
          type: integer
          format: int32
        decision:
          type: string
        markTaskDisputed:
          type: boolean
        punishedUserId:
          type: integer
          format: int64
        status:
          type: string
          enum:
          - PENDING
          - PROCESSING
          - APPROVED
          - REJECTED
          - RESOLVED
          - PUNISHED
    Result:
      type: object
      properties:
        code:
          type: string
        data:
          type: object
        message:
          type: string
        meta:
          $ref: "#/components/schemas/Meta"
    SendMessageRequest:
      type: object
      properties:
        attachmentIds:
          type: array
          items:
            type: integer
            format: int64
        content:
          type: string
        type:
          type: string
          enum:
          - TEXT
          - IMAGE
          - SYSTEM_NOTIFICATION
    SubmitCompletionRequest:
      type: object
      properties:
        attachmentIds:
          type: array
          items:
            type: integer
            format: int64
        description:
          type: string
    TaskStatusTransitionRequest:
      type: object
      properties:
        action:
          type: string
          enum:
          - START
          - CONFIRM_COMPLETION
          - REJECT_COMPLETION
          - DISPUTE
          - CANCEL
        reason:
          type: string
    UpdatePostRequest:
      type: object
      properties:
        content:
          type: string
        status:
          type: string
          enum:
          - DRAFT
          - PUBLISHED
          - PENDING_REVIEW
          - HIDDEN
          - CLOSED
          - DELETED
          - REJECTED
        title:
          type: string
    UpdateTaskRequest:
      type: object
      properties:
        allowOfflineContact:
          type: boolean
        completionStandard:
          type: string
        deadline:
          type: string
          format: date-time
        description:
          type: string
        onlyInAppContact:
          type: boolean
        requiresProof:
          type: boolean
        rewardAmount:
          type: integer
          format: int32
        rewardDescription:
          type: string
        rewardType:
          type: string
          enum:
          - FREE
          - POINTS
          - CASH
          - NEGOTIABLE
        title:
          type: string
    UpdateUserProfileRequest:
      type: object
      properties:
        avatarUrl:
          type: string
        bio:
          type: string
        campus:
          type: string
        college:
          type: string
        contactInfo:
          type: string
        interestTags:
          type: array
          items:
            type: string
        nickname:
          type: string
        skillTags:
          type: array
          items:
            type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
