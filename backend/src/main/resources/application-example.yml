spring:
  application:
    name: campusbridge
  # Spring Boot datasource — configure via CI/CD variables or environment
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/campusbridge?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:changeme}
  servlet:
    multipart:
      # File upload limits
      max-file-size: 5MB
      max-request-size: 10MB
  mail:
    host: ${SMTP_HOST:smtp.example.com}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USERNAME:your-email@example.com}
    password: ${SMTP_PASSWORD:your-smtp-password}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

# MyBatis
mybatis:
  configuration:
    map-underscore-to-camel-case: true

# Aliyun OSS
aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:https://oss-cn-beijing.aliyuncs.com}
    bucketName: ${ALIYUN_OSS_BUCKET:campusbridge}
    region: ${ALIYUN_OSS_REGION:cn-beijing}

# JWT
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
  refresh-expiration: 2592000000
  header: Authorization
  prefix: "Bearer "

campusbridge:
  verification:
    email:
      enabled: ${VERIFICATION_EMAIL_ENABLED:false}
      debug-code-enabled: false
      code-secret: ${VERIFICATION_EMAIL_CODE_SECRET:campusbridge-email-code}

server:
  port: ${SERVER_PORT:8081}
  forward-headers-strategy: native
