spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  application:
    name: campusbridge
  # Spring Boot datasource — configure via CI/CD variables or environment
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/campusbridge?connectionTimeZone=Asia/Shanghai&sslMode=DISABLED&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:campusbridge}
    password: ${MYSQL_PASSWORD}
  servlet:
    multipart:
      # File upload limits
      max-file-size: 5MB
      max-request-size: 10MB
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

# MyBatis
mybatis:
  configuration:
    map-underscore-to-camel-case: true

# Aliyun OSS
aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:https://oss-cn-beijing.aliyuncs.com}
    bucketName: ${ALIYUN_OSS_BUCKET:campusbridge}
    region: ${ALIYUN_OSS_REGION:cn-beijing}

# JWT
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
  refresh-expiration: 2592000000
  header: Authorization
  prefix: "Bearer "

campusbridge:
  verification:
    email:
      enabled: ${VERIFICATION_EMAIL_ENABLED:false}
      debug-code-enabled: ${VERIFICATION_DEBUG_CODE_ENABLED:false}
      code-secret: ${VERIFICATION_EMAIL_CODE_SECRET:campusbridge-email-code}

server:
  port: ${SERVER_PORT:8081}
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

---
spring:
  config:
    activate:
      on-profile: "!test"
    import: optional:classpath:application-local.yml
