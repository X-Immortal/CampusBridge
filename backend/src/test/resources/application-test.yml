spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:campusbridge_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 10MB

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

jwt:
  secret: test-secret-key-at-least-64-characters-for-hs256-please-do-not-use-prod
  expiration: 86400000
  refresh-expiration: 2592000000
  header: Authorization
  prefix: "Bearer "
