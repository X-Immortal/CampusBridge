spring:
  mail:
    host: ""
    username: ""
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:campusbridge_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    druid:
      validation-query: SELECT 1
  sql:
    init:
      mode: never

jwt:
  secret: test-secret-key-at-least-64-characters-for-hs256-please-do-not-use-prod

campusbridge:
  verification:
    email:
      enabled: false
      debug-code-enabled: true
      code-secret: test-email-code-secret

aliyun:
  oss:
    endpoint: https://oss-test.example.com
    bucketName: campusbridge-test
    region: cn-test

task:
  timeout:
    scan-initial-delay-ms: 3600000
