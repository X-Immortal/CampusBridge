name: campusbridge-test

services:
  mysql:
    image: mysql:9.7.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中填写 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: campusbridge
      MYSQL_USER: campusbridge
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中填写 MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../mysql/my.cnf:/etc/mysql/conf.d/campusbridge.cnf:ro
      - ../mysql/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ../mysql/reseed_demo_data.sql:/docker-entrypoint-initdb.d/20-demo-data.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1
          -u "$${MYSQL_USER}" "$${MYSQL_DATABASE}" -e 'SELECT 1' >/dev/null
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  backend:
    build: ../../backend
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      TZ: Asia/Shanghai
      MYSQL_URL: jdbc:mysql://mysql:3306/campusbridge?connectionTimeZone=Asia/Shanghai&sslMode=DISABLED&allowPublicKeyRetrieval=true
      MYSQL_USERNAME: campusbridge
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中填写 MYSQL_PASSWORD}
      FORWARD_HEADERS_STRATEGY: framework
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中填写至少 32 字节的 JWT_SECRET}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      VERIFICATION_EMAIL_ENABLED: ${VERIFICATION_EMAIL_ENABLED:-false}
      VERIFICATION_DEBUG_CODE_ENABLED: ${VERIFICATION_DEBUG_CODE_ENABLED:-true}
      VERIFICATION_EMAIL_CODE_SECRET: ${VERIFICATION_EMAIL_CODE_SECRET:-${JWT_SECRET}}
      ALIYUN_OSS_ENDPOINT: ${ALIYUN_OSS_ENDPOINT:-https://oss-cn-beijing.aliyuncs.com}
      ALIYUN_OSS_BUCKET: ${ALIYUN_OSS_BUCKET:-campusbridge}
      ALIYUN_OSS_REGION: ${ALIYUN_OSS_REGION:-cn-beijing}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_SESSION_TOKEN: ${OSS_SESSION_TOKEN:-}
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ../../frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ && wget -q -O /dev/null 'http://127.0.0.1/api/v1/content?size=1'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s

volumes:
  mysql-data:
