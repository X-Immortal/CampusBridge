<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampusBridge 校园互助服务平台</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('cb-theme') || 'system';
          var accent = localStorage.getItem('cb-accent') || 'purple';
          var density = localStorage.getItem('cb-density') || 'comfortable';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var effective = theme === 'system' ? (prefersDark ? 'dark' : 'light') : theme;
          document.documentElement.setAttribute('data-theme', effective);
          document.documentElement.setAttribute('data-accent', accent);
          document.documentElement.setAttribute('data-density', density);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
